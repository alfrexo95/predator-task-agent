name: Predator BasedAgents

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install BasedAgents SDK
        run: pip install -r requirements.txt

      - name: Run agent
        env:
          AGENT_NAME: PredatorTaskAgent
        run: python agent.py
